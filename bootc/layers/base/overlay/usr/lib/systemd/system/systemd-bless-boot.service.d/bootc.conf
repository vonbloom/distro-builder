# systemd-bless-boot renames the boot entry that systemd-boot is counting (bootc-boot-count) to
# drop its counter once the boot is complete: the read-only ESP remounted read-write in the unit's
# own mount namespace, in the same process (see systemd-boot-update.service.d/bootc.conf), then
# upstream's ExecStart=. If the rename fails, a good update is marked bad after three boots
[Service]
PrivateMounts=yes
ExecStart=
ExecStart=/usr/bin/sh -c 'mount -o remount,rw /boot; exec /usr/lib/systemd/systemd-bless-boot good'
