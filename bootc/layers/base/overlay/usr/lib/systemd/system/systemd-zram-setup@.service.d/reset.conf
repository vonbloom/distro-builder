# The device reset when the unit stops (the shutdown) can fail with "Device or resource busy"
# right after the swap on it is deactivated: a failed unit in the shutdown of an update, which
# fails bootc/test (seen once in six shutdowns, 2026-10-19). Harmless there, the memory goes anyway
[Service]
ExecStop=
ExecStop=-/usr/lib/systemd/system-generators/zram-generator --reset-device '%i'
