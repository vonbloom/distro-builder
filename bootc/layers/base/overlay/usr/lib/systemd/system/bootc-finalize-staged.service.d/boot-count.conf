# Boot counting for the image bootc finalizes (bootc-boot-count): ExecStop lines run in order, and
# the next one only when the previous succeeded, so it runs once bootc's own has moved the new
# boot entry into /boot/loader/entries. The script remounts the read-only ESP read-write in the
# unit's own mount namespace (the unit has one already for ProtectHome= and ReadOnlyPaths=;
# PrivateMounts= keeps it so). "-": an update that is not counted still boots
[Service]
PrivateMounts=yes
ExecStop=-/usr/bin/bootc-boot-count
