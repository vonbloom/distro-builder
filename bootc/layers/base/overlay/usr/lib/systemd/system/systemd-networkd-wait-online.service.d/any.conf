# Online as soon as one link is: a laptop has Wi-Fi or a cable, rarely both. By default
# wait-online waits for every managed link to be configured, and an Ethernet port without a cable
# (or wg0 before its peer answers) stays "configuring": a 2 min timeout and a failed unit (the
# T480 on 2026-10-17, pulled in by archlinux-keyring-wkd-sync)
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any
