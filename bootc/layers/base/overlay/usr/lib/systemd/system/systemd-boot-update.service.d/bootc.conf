# bootc mounts the ESP read-only at /boot (systemd.mount-extra=...:/boot:auto:ro on the kernel
# command line, written by bootc install), and bootctl update would fail to write a newer
# systemd-boot there. Remounted read-write in the unit's own mount namespace, as bootc does when it
# writes the boot entries (bootc_composefs/boot.rs, mount_esp_writable): the system's mount keeps
# its read-only flag. In the same process as bootctl: a remount in ExecStartPre= does not reach
# ExecStart= (systemd-bless-boot, set up that way at first, failed on "Read-only file system" in
# bootc/test, 2026-10-19). With no ESP at /boot the remount fails and bootctl --graceful finds none.
[Service]
PrivateMounts=yes
ExecStart=
ExecStart=/usr/bin/sh -c 'mount -o remount,rw /boot; exec bootctl --variables=no --graceful update'
