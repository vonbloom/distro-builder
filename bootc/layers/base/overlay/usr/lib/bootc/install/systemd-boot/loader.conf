# Copied to the ESP by bootc install, and only then: a change here reaches an installed machine by
# hand (bootc/README.md).
# The boot menu: hidden, the default entry boots at once (timeout 0). Holding Space while the
# machine starts shows it, and so does the power menu's reboot to it (systemctl reboot
# --boot-loader-menu=0); a new image that does not boot falls back to the previous one by itself
# (boot counting, bootc-boot-count). The other lines as the arkdep installer sets them.
timeout 0
console-mode max
editor no
auto-entries yes
auto-firmware yes
