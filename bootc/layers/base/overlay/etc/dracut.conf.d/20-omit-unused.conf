# Modules a --no-hostonly initramfs includes by default but no device here uses (2026-10-08: about
# 20 MB of the 110 MB unpacked). Put one back if the feature comes:
# - hwdb: udev's hardware database (13 MB), loaded by the real root; the initramfs only mounts it
# - crypt, systemd-cryptsetup, fido2, pkcs11, dm: LUKS (and its FIDO2 / smart card unlock),
#   device-mapper (LVM). The disks are not encrypted
# - mdraid, nvdimm, lunmask: software RAID, persistent memory, SAN LUN masking
# - qemu-net, virtfs, virtiofs: network and shared folder roots in VMs (iso/test-vm boots a virtual
#   disk: qemu stays)
# - modsign: extra module signing keys; the kernel checks its modules with its built-in key
# - systemd-pcrextend: boot phase measurements into the TPM, for TPM-bound secrets
omit_dracutmodules+=" hwdb crypt systemd-cryptsetup fido2 pkcs11 dm mdraid nvdimm lunmask qemu-net virtfs virtiofs modsign systemd-pcrextend "
# Only ext4's fsck in the initramfs, which mounts the root: the root is ext4 since 2026-10-18
# (bootc/install), and the initramfs' systemd-fsck-root repairs one marked with errors (e2fsck
# -p) before mounting it. A btrfs root (the T480 until its reinstall) has no fsck.btrfs here and is
# skipped. Other filesystems (/var/home) are checked and mounted by the real root
fscks="fsck.ext4 e2fsck"
