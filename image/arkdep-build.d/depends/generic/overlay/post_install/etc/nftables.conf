#!/usr/bin/nft -f
# vim:set ts=2 sw=2 et:

# IPv4/IPv6 Simple & Safe firewall ruleset.
# More examples in /usr/share/nftables/ and /usr/share/doc/nftables/examples/.
# Open extra ports with fw (/usr/local/bin/fw), not here: it keeps them in /etc/nftables.d/fw.nft.

destroy table inet filter
table inet filter {
  set allowed_tcp {
    type inet_service
    flags interval
    comment "TCP ports opened with fw"
  }
  set allowed_udp {
    type inet_service
    flags interval
    comment "UDP ports opened with fw"
  }

  chain input {
    type filter hook input priority filter
    policy drop

    ct state invalid drop comment "early drop of invalid connections"
    ct state {established, related} accept comment "allow tracked connections"
    iif lo accept comment "allow from loopback"
    ip protocol icmp accept comment "allow icmp"
    meta l4proto ipv6-icmp accept comment "allow icmp v6"
    tcp dport ssh accept comment "allow sshd"
    tcp dport @allowed_tcp accept comment "allow ports opened with fw"
    udp dport @allowed_udp accept comment "allow ports opened with fw"
    iifname virbr0 udp dport {53, 67} accept comment "allow VM dhcp/dns requests to host"
    pkttype host limit rate 5/second counter reject with icmpx type admin-prohibited
    counter
  }
  chain forward {
    type filter hook forward priority filter
    policy drop

    iifname virbr0 accept
    oifname virbr0 accept
  }
}

# Elements of allowed_tcp and allowed_udp written by fw (a wildcard without matches is no error)
include "/etc/nftables.d/*.nft"
